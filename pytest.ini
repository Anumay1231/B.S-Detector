[pytest]
# Only ever collect this project's own tests.
#
# Without this, running `pytest` with no arguments from a parent directory
# (e.g. C:\Users\<you>) makes pytest walk the whole tree -- including
# Python's own stdlib test suite and site-packages -- producing thousands
# of irrelevant collection errors. Pinning testpaths keeps a bare
# `pytest` scoped to this repository.
testpaths = tests

# scripts/ contains CLI entry points whose filenames start with "test_"
# (scripts/test_encoder.py etc.). Those are manual diagnostic tools, not
# pytest modules -- tests/ has the real coverage for them.
norecursedirs = .git .venv venv env build dist data outputs scripts __pycache__ *.egg-info

addopts = -q
